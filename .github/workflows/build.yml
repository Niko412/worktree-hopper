name: Build

# Every push and pull request runs the tests; the .vsix is built only after they pass.
# Only a vX.Y.Z tag makes a release, and only after the release guard (scripts/release-guard.sh) passes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard the tag
        run: scripts/release-guard.sh tag "$GITHUB_REF_NAME"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax and shell checks
        run: |
          node --check extension.js
          node --check media/view.js
          node --check media/filter.js
          shellcheck scripts/*.sh
      - name: Unit tests
        run: npm test

  integration:
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, vscode: '1.85.0' }
          - { os: ubuntu-latest, vscode: stable }
          - { os: windows-latest, vscode: stable }
          - { os: macos-latest, vscode: stable }
    name: integration (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ matrix.vscode }}-${{ runner.os }}
      - name: Integration tests in VS Code ${{ matrix.vscode }} (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration
      - name: Integration tests in VS Code ${{ matrix.vscode }}
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: npm run test:integration

  package:
    needs: [unit, integration]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the .vsix
        run: npx vsce package --readme-path MARKETPLACE.md --out worktree-hopper-dev.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: worktree-hopper-dev-vsix
          path: worktree-hopper-dev.vsix
          retention-days: 14

  release:
    needs: [guard, unit, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the .vsix
        run: npx vsce package --readme-path MARKETPLACE.md --out "worktree-hopper-${GITHUB_REF_NAME#v}.vsix"
      - name: Guard the .vsix
        run: scripts/release-guard.sh vsix "$GITHUB_REF_NAME" "worktree-hopper-${GITHUB_REF_NAME#v}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: worktree-hopper-vsix
          path: worktree-hopper-*.vsix
      - name: Publish the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" "worktree-hopper-${GITHUB_REF_NAME#v}.vsix" \
            --title "$GITHUB_REF_NAME" --notes "$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)"

  # Publishing to the stores runs only after the GitHub release:
  #   Open VSX: trusted publishing (registered at open-vsx.org for build.yml and the openvsx environment).
  #   Visual Studio Marketplace, once set up: the repository variables AZURE_CLIENT_ID and AZURE_TENANT_ID of an Entra ID
  #   app registration whose federated credential trusts this repository's `marketplace` environment
  #   (which only v* tags may use); no secret is stored.
  publish-openvsx:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Open VSX trusted publishing: the registry trusts this workflow (build.yml) in this environment,
    # which only v* tags may use, and exchanges GitHub's OIDC token for a short-lived one. No secret.
    environment: openvsx
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the release's .vsix
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix'
      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish worktree-hopper-*.vsix --trusted-publishing

  publish-marketplace:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the release's .vsix
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix'
      - name: Sign in to Entra ID with GitHub's OIDC token
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Show the app's Marketplace user id (add it under the publisher's Members once)
        run: |
          id="$(az rest --method get \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.3' \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          echo "::notice::Marketplace user id of this app: $id"
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@3 publish --azure-credential --packagePath worktree-hopper-*.vsix
