name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check syntax
        run: |
          node --check extension.js
          node --check media/view.js

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $want"
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce@3 package --out worktree-switch.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: worktree-switch-vsix
          path: worktree-switch.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: worktree-switch-vsix

      - name: Publish a GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv worktree-switch.vsix "worktree-switch-${GITHUB_REF_NAME#v}.vsix"
          gh release create "$GITHUB_REF_NAME" "worktree-switch-${GITHUB_REF_NAME#v}.vsix" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
