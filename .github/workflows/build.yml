name: Build

# Every push and pull request runs the tests; the .vsix is built only after they pass.
# Only a vX.Y.Z tag makes a release, and only after the release guard (scripts/release-guard.sh) passes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard the tag
        run: scripts/release-guard.sh tag "$GITHUB_REF_NAME"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax and shell checks
        run: |
          node --check extension.js
          node --check media/view.js
          node --check media/filter.js
          shellcheck scripts/*.sh
      - name: Unit tests
        run: npm test

  integration:
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, vscode: '1.85.0' }
          - { os: ubuntu-latest, vscode: stable }
          - { os: windows-latest, vscode: stable }
          - { os: macos-latest, vscode: stable }
    name: integration (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ matrix.vscode }}-${{ runner.os }}
      - name: Integration tests in VS Code ${{ matrix.vscode }} (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration
      - name: Integration tests in VS Code ${{ matrix.vscode }}
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: npm run test:integration

  package:
    needs: [unit, integration]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the .vsix
        run: npx vsce package --readme-path MARKETPLACE.md --out worktree-switch-dev.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: worktree-switch-dev-vsix
          path: worktree-switch-dev.vsix
          retention-days: 14

  release:
    needs: [guard, unit, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the .vsix
        run: npx vsce package --readme-path MARKETPLACE.md --out "worktree-switch-${GITHUB_REF_NAME#v}.vsix"
      - name: Guard the .vsix
        run: scripts/release-guard.sh vsix "$GITHUB_REF_NAME" "worktree-switch-${GITHUB_REF_NAME#v}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: worktree-switch-vsix
          path: worktree-switch-*.vsix
      - name: Publish the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" "worktree-switch-${GITHUB_REF_NAME#v}.vsix" \
            --title "$GITHUB_REF_NAME" --notes "$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)"
